<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TikTok Login abgeschlossen</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
<h2>Login abgeschlossen</h2>
<p>Kopiere den folgenden Code und fuege ihn im Terminal ein:</p>
<pre id="code" style="background:#eee; padding:12px; word-break:break-all;"></pre>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('code').textContent = params.get('code') || '(kein code-Parameter gefunden)';
</script>
</body>
</html>
